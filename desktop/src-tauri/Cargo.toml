[package]
name = "quedamos"
version = "0.1.0"
description = "Quedamos desktop: records meetings with microphone and computer audio"
authors = ["Klever Ontaneda"]
license = "LicenseRef-Proprietary"
edition = "2021"

[lib]
name = "quedamos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Native capture: microphone and the computer's own output (loopback) without screen sharing.
# Loopback = an input stream built on the output device (WASAPI on Windows, Core Audio tap on macOS 14.6+).
cpal = "0.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
