<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quedamos — Prototipo de interfaz</title>
<style>
@font-face { font-family: 'Satoshi'; src: url('fonts/satoshi-400.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'Satoshi'; src: url('fonts/satoshi-500.woff2') format('woff2'); font-weight: 500; }
@font-face { font-family: 'Satoshi'; src: url('fonts/satoshi-700.woff2') format('woff2'); font-weight: 700; }
@font-face { font-family: 'Satoshi'; src: url('fonts/satoshi-900.woff2') format('woff2'); font-weight: 900; }

/* ================= tokens ================= */
:root, [data-theme='light'] {
  --page: #dfe2ea; --bg: #f6f7fb; --surface: #ffffff; --raised: #ffffff; --fg: #141a2e; --muted: #667089; --faint: #98a1b5;
  --border: #e5e8f0; --hover: #f1f2f8; --press: #e7e9f2;
  --accent: #5b4ce0; --accent-hover: #4d3fd0; --accent-soft: #efedff; --on-accent: #fff;
  --ink-btn: #141a2e; --ink-btn-hover: #262e48; --on-ink: #fff;
  --danger: #d4405a; --danger-soft: #fdecef; --ok: #138a6c; --ok-soft: #e3f5ee; --warn: #b8730c; --warn-soft: #fdf3e2;
  --rec: #ff4d67; --shadow: 0 1px 2px rgba(20,26,46,.05), 0 10px 30px -14px rgba(20,26,46,.25); --shimmer: rgba(255,255,255,.7);
  color-scheme: light;
}
[data-theme='dark'] {
  --page: #07080d; --bg: #0e1018; --surface: #151824; --raised: #1b1f2e; --fg: #eceef6; --muted: #9aa2b8; --faint: #6c7489;
  --border: #252a3a; --hover: #1e2232; --press: #262b3d;
  --accent: #8f82ff; --accent-hover: #a297ff; --accent-soft: rgba(143,130,255,.16); --on-accent: #0e1018;
  --ink-btn: #eceef6; --ink-btn-hover: #ffffff; --on-ink: #0e1018;
  --danger: #ff7088; --danger-soft: rgba(255,112,136,.14); --ok: #3fd1a6; --ok-soft: rgba(63,209,166,.14); --warn: #f0b558; --warn-soft: rgba(240,181,88,.14);
  --rec: #ff5a72; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 14px 34px -14px rgba(0,0,0,.7); --shimmer: rgba(255,255,255,.06);
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
body { font-family: 'Satoshi', ui-sans-serif, system-ui, sans-serif; background: var(--page); color: var(--fg); font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; transition: background .25s; }
button { font: inherit; color: inherit; }
.ico { width: 18px; height: 18px; display: inline-block; flex: none; }
.muted { color: var(--muted); }

/* ================= review toolbar (not part of the app) ================= */
.review { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 24px; background: #10131d; color: #fff; }
.review b { font-weight: 900; letter-spacing: -.02em; margin-right: 10px; }
.review .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.review .tabs a { color: #b7bdd0; text-decoration: none; font-weight: 700; font-size: 13px; padding: 6px 11px; border-radius: 8px; }
.review .tabs a:hover { background: #1f2434; color: #fff; }
.review .tabs a.on { background: #fff; color: #10131d; }
.review .theme { margin-left: auto; display: flex; background: #1f2434; border-radius: 999px; padding: 3px; }
.review .theme button { border: 0; background: none; color: #b7bdd0; font-weight: 700; font-size: 13px; padding: 5px 12px; border-radius: 999px; cursor: pointer; }
.review .theme button.on { background: #fff; color: #10131d; }
.stage { padding: 28px 24px 60px; display: grid; gap: 18px; justify-content: center; }
.note-tag { color: #6a7287; font-size: 13px; font-weight: 700; }
[data-theme='dark'] .note-tag { color: #8a92a8; }

/* ================= atoms ================= */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid transparent; font-weight: 700; font-size: 14px; background: var(--ink-btn); color: var(--on-ink); cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s, transform .08s, box-shadow .15s; }
.btn:hover, .btn.is-hover { background: var(--ink-btn-hover); }
.btn:active, .btn.is-press { transform: scale(.97); }
.btn:focus-visible, .btn.is-focus { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.accent { background: var(--accent); color: var(--on-accent); }
.btn.accent:hover, .btn.accent.is-hover { background: var(--accent-hover); box-shadow: 0 6px 16px -8px var(--accent); }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--border); }
.btn.ghost:hover, .btn.ghost.is-hover { background: var(--hover); border-color: var(--press); }
.btn.quiet { background: transparent; color: var(--muted); }
.btn.quiet:hover, .btn.quiet.is-hover { background: var(--hover); color: var(--fg); }
.btn.icon { width: 36px; padding: 0; }
.btn.sm { height: 30px; font-size: 13px; padding: 0 10px; border-radius: 8px; }
.btn[disabled], .btn.is-disabled { opacity: .45; pointer-events: none; }
.btn.loading { pointer-events: none; }
.btn.loading .spin { width: 14px; height: 14px; border-width: 2px; border-color: color-mix(in srgb, currentColor 30%, transparent); border-top-color: currentColor; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 700; background: var(--hover); color: var(--muted); white-space: nowrap; }
.chip.theme { background: var(--accent-soft); color: var(--accent); }
.chip.due { background: var(--danger-soft); color: var(--danger); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.h-sec { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
.box { width: 17px; height: 17px; border: 1.8px solid var(--faint); border-radius: 5px; flex: none; cursor: pointer; transition: border-color .15s, background .15s; display: grid; place-items: center; }
.box:hover { border-color: var(--accent); background: var(--accent-soft); }
.box.done { background: var(--ok); border-color: var(--ok); }
.box.done::after { content: ''; width: 8px; height: 4px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translate(1px,-1px); }
.star { color: #e9a400; }
.ava { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg,#c9c3ff,#8fd3c0); flex: none; }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.dot-rec { width: 10px; height: 10px; border-radius: 50%; background: var(--rec); flex: none; }
.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--rec) 60%, transparent); } 50% { box-shadow: 0 0 0 7px transparent; } }
.skel { background: var(--hover); border-radius: 7px; position: relative; overflow: hidden; }
.skel::after { content: ''; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, var(--shimmer), transparent); animation: shimmer 1.3s infinite; }
@keyframes shimmer { to { transform: translateX(100%); } }

/* ================= app frame (desktop) ================= */
.desk { width: 1320px; height: 860px; display: grid; grid-template-columns: 232px 1fr; background: var(--bg); border-radius: 14px; overflow: hidden; box-shadow: 0 24px 60px -24px rgba(0,0,0,.45); position: relative; }
.side { background: var(--surface); border-right: 1px solid var(--border); padding: 20px 14px; display: flex; flex-direction: column; gap: 4px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 900; font-size: 18px; letter-spacing: -.03em; padding: 0 8px 16px; }
.logo { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; color: var(--on-accent); }
.rec-big { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 12px; background: var(--ink-btn); color: var(--on-ink); font-weight: 700; margin-bottom: 14px; cursor: pointer; transition: background .15s, transform .08s; }
.rec-big:hover { background: var(--ink-btn-hover); }
.rec-big:active { transform: scale(.98); }
.rec-big .caret { margin-left: auto; opacity: .6; font-size: 12px; }
.nav a { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 9px; color: var(--muted); font-weight: 700; text-decoration: none; cursor: pointer; transition: background .15s, color .15s; }
.nav a:hover { background: var(--hover); color: var(--fg); }
.nav a.on { background: var(--hover); color: var(--fg); }
.nav a .count { margin-left: auto; font-size: 12px; color: var(--danger); }
.side .foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; transition: background .15s; }
.side .foot:hover { background: var(--hover); }
.side .foot small { display: flex; align-items: center; gap: 5px; color: var(--ok); font-size: 11.5px; font-weight: 500; }
.side .foot small i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.content { overflow: hidden; padding: 28px 36px; position: relative; }
.page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.page-h h1 { font-weight: 900; font-size: 30px; letter-spacing: -.035em; line-height: 1.1; }
.page-h p { color: var(--muted); margin-top: 3px; }
.search { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); color: var(--faint); transition: border-color .15s, box-shadow .15s; }
.search:hover { border-color: var(--press); }
.search.is-focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); color: var(--fg); }
.search kbd { margin-left: auto; font: inherit; font-size: 11.5px; border: 1px solid var(--border); border-radius: 5px; padding: 0 5px; }
.card { background: var(--surface); border-radius: 16px; padding: 16px 18px; border: 1px solid var(--border); }
.grid2 { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; }
.row { display: flex; align-items: center; gap: 10px; padding: 10px 8px; margin: 0 -8px; border-radius: 10px; transition: background .15s; }
.row:hover { background: var(--hover); }
.row .grow { flex: 1; min-width: 0; }
.row .grow b { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .grow small { color: var(--muted); font-size: 12.5px; }
.row .hover-act { opacity: 0; transition: opacity .15s; }
.row:hover .hover-act, .row.is-hover .hover-act { opacity: 1; }
.row.is-hover { background: var(--hover); }
.next { display: flex; gap: 16px; align-items: center; }
.next .when { text-align: center; padding-right: 16px; border-right: 1px solid var(--border); }
.next .when b { display: block; font-size: 26px; font-weight: 900; letter-spacing: -.04em; line-height: 1; }
.next .when small { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; }
.next .what { flex: 1; min-width: 0; }
.next .what b { display: block; font-size: 16px; }
.next .what small { color: var(--muted); }
.quick { display: flex; align-items: center; gap: 10px; }
.quick input { flex: 1; height: 40px; border: 0; background: transparent; font: inherit; color: var(--fg); outline: 0; }
.quick input::placeholder { color: var(--faint); }

/* list + editor */
.two { display: grid; grid-template-columns: 390px 1fr; height: 100%; margin: -28px -36px; }
.list { border-right: 1px solid var(--border); padding: 18px 16px; overflow: hidden; }
.filters { display: flex; gap: 6px; margin: 14px 0; overflow: hidden; }
.f { height: 28px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; font-weight: 700; color: var(--muted); display: inline-flex; align-items: center; white-space: nowrap; cursor: pointer; transition: all .15s; }
.f:hover { border-color: var(--press); color: var(--fg); }
.f.on { background: var(--ink-btn); color: var(--on-ink); border-color: var(--ink-btn); }
.nrow { padding: 11px 12px; border-radius: 11px; display: grid; gap: 3px; margin-bottom: 2px; cursor: pointer; transition: background .15s, box-shadow .15s; }
.nrow:hover { background: var(--hover); }
.nrow.on { background: var(--surface); box-shadow: 0 0 0 1px var(--border), 0 6px 16px -10px rgba(0,0,0,.3); }
.nrow .t { display: flex; align-items: center; gap: 6px; font-weight: 700; }
.nrow .t time { margin-left: auto; font-size: 12px; color: var(--faint); font-weight: 500; }
.nrow p { color: var(--muted); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nrow .tags { display: flex; gap: 5px; margin-top: 3px; }
.editor { padding: 26px 40px; overflow: hidden; background: var(--surface); position: relative; }
.ed-top { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
.ed-top .crumb { color: var(--faint); font-size: 13px; }
.ed-top .sp { flex: 1; }
.ed-title { font-weight: 900; font-size: 30px; letter-spacing: -.035em; line-height: 1.1; display: flex; gap: 10px; }
.ed-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin: 10px 0 16px; color: var(--muted); font-size: 13.5px; }
.ed-meta b { color: var(--fg); }
.ed-meta .sep { color: var(--border); }
.remind { display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 14px; border-radius: 12px; background: var(--hover); margin-bottom: 22px; }
.remind .bell { color: var(--accent); }
.remind .txt b { font-weight: 700; }
.remind .txt small { display: block; color: var(--muted); font-size: 12.5px; }
.remind .sp { flex: 1; }
.cal-added { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--ok); padding: 0 8px; }
.draft { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--warn); font-weight: 700; margin-bottom: 8px; }
.draft .btn { margin-left: auto; }
.overview { font-size: 16px; line-height: 1.6; margin-bottom: 22px; max-width: 62ch; }
.cols { display: grid; grid-template-columns: 1.15fr 1fr; gap: 32px; }
.task { display: flex; align-items: center; gap: 10px; padding: 9px 6px; margin: 0 -6px; border-bottom: 1px solid var(--border); border-radius: 6px; transition: background .15s; }
.task:hover { background: var(--hover); }
.task .who { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.task .cal-quick { opacity: 0; transition: opacity .15s; }
.task:hover .cal-quick, .task.is-hover .cal-quick { opacity: 1; }
.task.is-hover { background: var(--hover); }
.task.done span.tx { color: var(--faint); text-decoration: line-through; }
.task.add { color: var(--faint); border-bottom: 0; cursor: text; }
ul.pts { list-style: none; display: grid; gap: 8px; }
ul.pts li { padding-left: 14px; position: relative; }
ul.pts li::before { content: ''; position: absolute; left: 0; top: .62em; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.menu { position: absolute; width: 230px; background: var(--raised); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; z-index: 5; animation: pop .14s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
.menu div { padding: 8px 10px; border-radius: 8px; display: flex; align-items: center; gap: 9px; cursor: pointer; }
.menu div:hover, .menu .hl { background: var(--hover); }
.menu .danger { color: var(--danger); }
.menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }
.menu kbd { margin-left: auto; font: inherit; font-size: 11.5px; color: var(--faint); }

/* recording + processing overlays (desktop) */
.recbar { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; padding: 10px 12px 10px 18px; border-radius: 16px; background: var(--ink-btn); color: var(--on-ink); box-shadow: 0 18px 40px -14px rgba(0,0,0,.5); }
.recbar .time { font-weight: 900; font-variant-numeric: tabular-nums; font-size: 18px; letter-spacing: -.02em; }
.wave { display: flex; align-items: center; gap: 3px; height: 26px; }
.wave i { width: 3px; border-radius: 3px; background: currentColor; opacity: .85; animation: wave 1s ease-in-out infinite; }
@keyframes wave { 0%,100% { height: 4px; } 50% { height: 24px; } }
.recbar .src { font-size: 12.5px; opacity: .7; }
.recbar .btn { background: color-mix(in srgb, var(--on-ink) 12%, transparent); color: var(--on-ink); }
.recbar .btn.stop { background: var(--rec); color: #fff; }
.progress { position: absolute; top: 18px; right: 18px; width: 340px; padding: 14px 16px; border-radius: 14px; background: var(--raised); border: 1px solid var(--border); box-shadow: var(--shadow); display: grid; gap: 10px; animation: pop .2s ease-out; }
.progress .head { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.progress .head b { margin-left: auto; color: var(--accent); font-variant-numeric: tabular-nums; }
.bar { height: 7px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .4s ease; position: relative; overflow: hidden; }
.bar span::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); animation: shimmer 1.4s infinite; transform: translateX(-100%); }
.steps { list-style: none; display: grid; gap: 5px; font-size: 13px; }
.steps li { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.steps li.done { color: var(--fg); }
.steps li.done::before { content: '✓'; color: var(--ok); font-weight: 900; width: 16px; text-align: center; }
.steps li.now::before { content: ''; width: 12px; height: 12px; margin: 0 2px; border-radius: 50%; border: 2px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .8s linear infinite; }
.steps li.todo::before { content: '○'; color: var(--faint); width: 16px; text-align: center; }
.toast { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-radius: 12px; background: var(--ink-btn); color: var(--on-ink); font-weight: 500; box-shadow: var(--shadow); white-space: nowrap; }
.toast .ok { color: var(--ok); }
[data-theme='dark'] .toast .ok { color: #138a6c; }

/* pendientes */
.banner { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); margin-bottom: 18px; }
.banner b { color: var(--accent); }
.banner .btn { margin-left: auto; }
.group-h { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 0 6px; }
.group-h b { font-size: 15px; }
.group-h b.red { color: var(--danger); }

/* calendar */
.cal-wrap { display: grid; grid-template-columns: 1fr 340px; gap: 18px; height: calc(100% - 70px); }
.month { display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: auto repeat(6, 1fr); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: var(--surface); }
.month .dow { padding: 8px 10px; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); border-bottom: 1px solid var(--border); }
.day { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 6px 7px; display: grid; align-content: start; gap: 3px; cursor: pointer; transition: background .15s; min-height: 0; overflow: hidden; }
.day:nth-child(7n) { border-right: 0; }
.day:hover { background: var(--hover); }
.day .n { font-size: 12.5px; font-weight: 700; color: var(--muted); width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; }
.day.out .n { color: var(--faint); opacity: .5; }
.day.today .n { background: var(--accent); color: var(--on-accent); }
.day.sel { background: var(--accent-soft); }
.ev { font-size: 11.5px; font-weight: 700; padding: 1px 6px; border-radius: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev.meet { background: var(--accent-soft); color: var(--accent); }
.ev.task { background: var(--hover); color: var(--muted); }
.ev.due { background: var(--danger-soft); color: var(--danger); }
.agenda { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; overflow: hidden; }
.agenda h3 { font-weight: 900; font-size: 19px; letter-spacing: -.02em; }
.tl { margin-top: 14px; display: grid; gap: 0; }
.tl .slot { display: grid; grid-template-columns: 46px 1fr; gap: 10px; min-height: 40px; }
.tl .slot time { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; padding-top: 2px; }
.tl .slot .line { border-top: 1px solid var(--border); padding-top: 6px; }
.tl .blk { padding: 8px 10px; border-radius: 10px; background: var(--accent-soft); border-left: 3px solid var(--accent); }
.tl .blk b { display: block; font-size: 13.5px; }
.tl .blk small { color: var(--muted); font-size: 12px; }
.tl .now { position: relative; }
.tl .now::before { content: ''; position: absolute; left: -6px; right: 0; top: -1px; height: 2px; background: var(--rec); }
.tl .now::after { content: ''; position: absolute; left: -9px; top: -4px; width: 8px; height: 8px; border-radius: 50%; background: var(--rec); }

/* login */
.login { display: grid; place-items: center; height: 100%; background: var(--bg); grid-column: 1 / -1; }
.login-card { width: 420px; display: grid; justify-items: center; gap: 12px; text-align: center; background: var(--surface); border: 1px solid var(--border); border-radius: 22px; padding: 36px 34px 28px; box-shadow: var(--shadow); }
.login-card .logo { width: 54px; height: 54px; border-radius: 16px; }
.login-card h2 { font-weight: 900; font-size: 26px; letter-spacing: -.03em; }
.login-card p { color: var(--muted); }
.gbtn { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 18px 0 6px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--fg); font-weight: 700; cursor: pointer; transition: background .15s, box-shadow .15s; margin-top: 8px; }
.gbtn:hover, .gbtn.is-hover { background: var(--hover); box-shadow: 0 4px 14px -8px rgba(0,0,0,.4); }
.gbtn .g { width: 34px; height: 34px; border-radius: 50%; background: #fff; display: grid; place-items: center; }
.code { display: flex; gap: 8px; margin: 6px 0; }
.code span { width: 46px; height: 56px; border-radius: 12px; background: var(--hover); display: grid; place-items: center; font-weight: 900; font-size: 26px; letter-spacing: -.02em; }
.fine { font-size: 12.5px; color: var(--faint); }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: bounce 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%,80%,100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-5px); opacity: 1; } }

/* states board */
.board { width: 1320px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.board .card { display: grid; gap: 12px; align-content: start; background: var(--surface); }
.board .card > p:first-child { font-weight: 900; letter-spacing: -.02em; font-size: 16px; }
.state-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.state-row small { width: 100%; color: var(--faint); font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.sync { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: var(--hover); }
.sync.ok { color: var(--ok); } .sync.off { color: var(--warn); } .sync.err { color: var(--danger); }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.empty { display: grid; justify-items: center; gap: 8px; text-align: center; padding: 18px 10px; color: var(--muted); }
.empty .big { width: 52px; height: 52px; border-radius: 16px; background: var(--hover); display: grid; place-items: center; color: var(--faint); }
.empty b { color: var(--fg); font-size: 15px; }

/* ================= phone ================= */
.phones { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }
.pw { display: grid; gap: 10px; justify-items: center; }
.phone { width: 390px; height: 844px; border-radius: 46px; background: var(--bg); position: relative; overflow: hidden; box-shadow: 0 0 0 10px #10131d, 0 30px 60px -20px rgba(0,0,0,.5); }
.status { height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; font-size: 13.5px; font-weight: 700; }
.p-top { display: flex; align-items: center; gap: 10px; padding: 4px 18px 10px; }
.p-top .search { flex: 1; height: 42px; }
.p-body { padding: 4px 18px 120px; }
.p-h1 { font-weight: 900; font-size: 26px; letter-spacing: -.035em; line-height: 1.1; }
.p-date { color: var(--muted); margin: 3px 0 16px; }
.phone .card { margin-bottom: 12px; padding: 14px 16px; }
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 86px; background: var(--surface); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(5, 1fr); padding-top: 10px; }
.tabbar div { display: grid; justify-items: center; align-content: start; gap: 3px; font-size: 11px; font-weight: 700; color: var(--faint); }
.tabbar div.on { color: var(--fg); }
.fab { width: 58px; height: 58px; border-radius: 50%; background: var(--ink-btn); display: grid; place-items: center; margin-top: -28px; box-shadow: 0 10px 24px -8px rgba(0,0,0,.6); }
.fab span { width: 18px; height: 18px; border-radius: 50%; background: var(--rec); }
.p-note-top { display: flex; align-items: center; gap: 4px; padding: 4px 10px 4px 6px; }
.p-note-top .sp { flex: 1; }
.p-actions { display: flex; gap: 8px; margin: 14px 0 16px; }
.p-actions .btn { flex: 1; height: 44px; }
.sheet-dim { position: absolute; inset: 0; background: rgba(5,7,14,.5); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 26px 26px 0 0; padding: 10px 18px 34px; }
.grab { width: 40px; height: 5px; border-radius: 9px; background: var(--border); margin: 0 auto 16px; }
.opt { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 14px; border: 1.5px solid var(--border); margin-bottom: 10px; }
.opt.on { border-color: var(--accent); background: var(--accent-soft); }
.opt .oi { width: 40px; height: 40px; border-radius: 12px; background: var(--hover); display: grid; place-items: center; flex: none; }
.opt.on .oi { background: var(--surface); color: var(--accent); }
.opt small { display: block; color: var(--muted); font-size: 12.5px; }
.opt .radio { margin-left: auto; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); flex: none; }
.opt.on .radio { border: 6px solid var(--accent); }
.p-rec { position: absolute; left: 12px; right: 12px; bottom: 98px; display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; border-radius: 18px; background: var(--ink-btn); color: var(--on-ink); }
.p-rec .time { font-weight: 900; font-size: 18px; font-variant-numeric: tabular-nums; }
.p-rec .btn { background: color-mix(in srgb, var(--on-ink) 12%, transparent); color: var(--on-ink); }
.p-rec .btn.stop { background: var(--rec); color: #fff; }

/* ================= PDF ================= */
.pdf-page { width: 794px; min-height: 1123px; background: #fff; color: #141a2e; padding: 64px 72px; box-shadow: 0 24px 60px -24px rgba(0,0,0,.45); font-size: 12.5pt; line-height: 1.55; }
.pdf-head { display: flex; align-items: center; justify-content: space-between; padding-bottom: 16px; border-bottom: 2px solid #141a2e; margin-bottom: 26px; }
.pdf-head .b { display: flex; align-items: center; gap: 8px; font-weight: 900; letter-spacing: -.02em; }
.pdf-head .b span { width: 22px; height: 22px; border-radius: 6px; background: #5b4ce0; }
.pdf-head small { color: #667089; font-size: 9.5pt; }
.pdf-page h1 { font-weight: 900; font-size: 25pt; letter-spacing: -.03em; line-height: 1.1; }
.pdf-meta { display: grid; grid-template-columns: repeat(4, auto); justify-content: start; gap: 4px 28px; margin: 14px 0 22px; font-size: 10pt; }
.pdf-meta dt { color: #667089; font-size: 8.5pt; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.pdf-meta dd { font-weight: 700; }
.pdf-page h2 { font-size: 9.5pt; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #5b4ce0; margin: 22px 0 8px; }
.pdf-page .lead { font-size: 13pt; }
.pdf-page ul { padding-left: 18px; display: grid; gap: 4px; }
.pdf-tbl { width: 100%; border-collapse: collapse; font-size: 11pt; }
.pdf-tbl th { text-align: left; font-size: 8.5pt; text-transform: uppercase; letter-spacing: .06em; color: #667089; padding: 6px 8px; border-bottom: 1px solid #d9dde8; }
.pdf-tbl td { padding: 8px; border-bottom: 1px solid #eceef4; vertical-align: top; }
.pdf-tbl .cb { width: 12px; height: 12px; border: 1.5px solid #98a1b5; border-radius: 3px; display: inline-block; }
.pdf-inferred { background: #f6f7fb; border-radius: 8px; padding: 10px 14px; font-size: 10.5pt; color: #4a5370; }
.pdf-transcript { font-size: 10pt; color: #3a4257; column-count: 2; column-gap: 28px; }
.pdf-transcript p { margin-bottom: 6px; }
.pdf-transcript b { color: #141a2e; }
.pdf-foot { display: flex; justify-content: space-between; margin-top: 30px; padding-top: 10px; border-top: 1px solid #e5e8f0; font-size: 8.5pt; color: #98a1b5; }


/* perfil */
.side .foot.on { background: var(--hover); border-color: var(--press); }
.prof { display: grid; grid-template-columns: 210px 1fr; gap: 28px; }
.prof-nav { display: grid; align-content: start; gap: 2px; }
.prof-nav a { padding: 8px 12px; border-radius: 9px; font-weight: 700; color: var(--muted); cursor: pointer; transition: background .15s, color .15s; }
.prof-nav a:hover { background: var(--hover); color: var(--fg); }
.prof-nav a.on { background: var(--accent-soft); color: var(--accent); }
.prof-main { overflow: hidden; display: grid; gap: 14px; align-content: start; max-width: 760px; }
.who { display: flex; align-items: center; gap: 16px; }
.who .ava { width: 56px; height: 56px; }
.who b { font-size: 19px; font-weight: 900; letter-spacing: -.02em; display: block; }
.set { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.set:last-child { border-bottom: 0; }
.set .grow { flex: 1; min-width: 0; }
.set .grow b { display: block; font-weight: 700; }
.set .grow small { color: var(--muted); font-size: 13px; }
.sel { height: 34px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13.5px; cursor: pointer; }
.sel:hover { border-color: var(--press); }
.toggle { width: 40px; height: 24px; border-radius: 99px; background: var(--press); position: relative; cursor: pointer; transition: background .2s; flex: none; }
.toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
.toggle.on { background: var(--accent); }
.toggle.on::after { transform: translateX(16px); }
.seg { display: inline-flex; background: var(--hover); border-radius: 10px; padding: 3px; }
.seg span { padding: 5px 12px; border-radius: 8px; font-weight: 700; font-size: 13px; color: var(--muted); cursor: pointer; }
.seg span.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.meter { height: 8px; border-radius: 99px; background: var(--hover); overflow: hidden; display: flex; }
.meter i { display: block; height: 100%; }
.key { font-family: ui-monospace, monospace; font-size: 13px; color: var(--muted); }
.danger-zone { border-color: color-mix(in srgb, var(--danger) 35%, var(--border)); }
/* actualización */
.upd-bar { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; border-radius: 14px; background: var(--ink-btn); color: var(--on-ink); box-shadow: var(--shadow); }
.upd-bar .btn { background: color-mix(in srgb, var(--on-ink) 12%, transparent); color: var(--on-ink); }
.upd-bar .btn.go { background: var(--accent); color: var(--on-accent); }
.upd-badge { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.modal-dim { position: absolute; inset: 0; background: rgba(5,7,14,.45); display: grid; place-items: center; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.modal { width: 460px; background: var(--raised); border: 1px solid var(--border); border-radius: 20px; padding: 24px; box-shadow: var(--shadow); display: grid; gap: 14px; animation: pop .2s ease-out; }
.modal h3 { font-weight: 900; font-size: 21px; letter-spacing: -.02em; }
.modal ul { list-style: none; display: grid; gap: 7px; }
.modal li { display: flex; gap: 9px; }
.modal li::before { content: '✦'; color: var(--accent); }

/* source dropdown */
.rec-wrap { position: relative; }
.rec-big .caret { padding: 4px 8px; margin-right: -6px; border-radius: 7px; transition: background .15s; opacity: .75; }
.rec-big .caret:hover, .rec-big .caret.open { background: color-mix(in srgb, var(--on-ink) 16%, transparent); opacity: 1; }
.src-menu { left: 0; top: 50px; width: 290px; }
.src-menu > div { align-items: center; gap: 11px; }
.src-menu .oi { width: 34px; height: 34px; border-radius: 10px; background: var(--hover); display: grid; place-items: center; flex: none; color: var(--muted); }
.src-menu .on .oi { background: var(--accent-soft); color: var(--accent); }
.src-menu .t { display: grid; flex: 1; line-height: 1.3; }
.src-menu .t small { color: var(--muted); font-size: 12px; }
.src-menu .chk { color: var(--accent); }
.lvl { display: flex; gap: 3px; margin-top: 5px; }
.lvl i { width: 14px; height: 5px; border-radius: 2px; background: var(--press); }
.lvl i:nth-child(-n+4) { background: var(--ok); animation: lvl 0.9s ease-in-out infinite alternate; }
.lvl i:nth-child(5), .lvl i:nth-child(6) { animation: lvl2 0.9s ease-in-out infinite alternate; }
@keyframes lvl { from { opacity: .45; } }
@keyframes lvl2 { 50% { background: var(--ok); } }
.sec { display: grid; gap: 14px; }

@media (prefers-reduced-motion: reduce) { *, *::after, *::before { animation: none !important; transition: none !important; } }
</style>

        <div class="upd-bar" style="opacity:.92"><span class="dot-rec pulse"></span><span style="flex:1"><span><b>Actualización lista.</b> <span style="opacity:.7">Se instala al terminar de grabar.</span></span></span><button class="btn sm">Entendido</button></div>
        <p class="h-sec" style="margin-top:8px">En el celular (app web)</p>
        <div class="toast" style="position:static;transform:none;justify-self:start"><svg class="ico" style="color:var(--accent)"><use href="#i-spark"/></svg>Hay una versión nueva · <u>Actualizar</u></div>
      </div>
      <div class="modal-dim" style="background:none;inset:auto;right:36px;top:110px"><div class="modal">
        <span class="chip theme" style="justify-self:start">Novedades · 1.3.0</span>
        <h3>Quedamos se actualizó</h3>
        <ul><li>Añadir al calendario con un toque, desde cualquier pendiente.</li><li>"Unirse y grabar": entra a la reunión y empieza a grabar a la vez.</li><li>Modo oscuro automático.</li><li>Grabaciones largas un 30 % más rápidas.</li></ul>
        <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn quiet">Ver todo</button><button class="btn accent">Listo</button></div>
      </div></div>
    </section>
  </div>
</template>

<!-- PDF -->
<template id="t-pdf">
  <p class="note-tag">Exportar PDF · siempre en claro (papel) · página A4</p>
  <article class="pdf-page">
    <header class="pdf-head"><span class="b"><span></span>Quedamos</span><small>Exportado el 28 nov 2026, 10:12</small></header>
    <h1>Planificación de ventas de diciembre</h1>
    <dl class="pdf-meta"><div><dt>Tipo</dt><dd>Reunión</dd></div><div><dt>Fecha</dt><dd>Sáb 28 nov · 09:30</dd></div><div><dt>Duración</dt><dd>42 min</dd></div><div><dt>Tema</dt><dd>Ventas</dd></div><div style="grid-column:1/-1;margin-top:6px"><dt>Participantes</dt><dd>Juan, María, Klever</dd></div></dl>
    <h2>Resumen</h2>
    <p class="lead">Se revisó el stock de temporada y se acordó adelantar el pedido al proveedor para no quedarse sin productos en la última semana.</p>
    <h2>Decisiones</h2>
    <ul><li>Adelantar el pedido navideño al 5 de diciembre.</li></ul>
    <h2>Pendientes</h2>
    <table class="pdf-tbl"><thead><tr><th style="width:24px"></th><th>Tarea</th><th>Responsable</th><th>Fecha</th></tr></thead>
      <tbody><tr><td><span class="cb"></span></td><td>Revisar inventario de la bodega 2</td><td>—</td><td>Sáb 28 nov</td></tr><tr><td><span class="cb"></span></td><td>Enviar la cotización al proveedor</td><td>Juan</td><td>Mié 3 dic</td></tr></tbody></table>
    <h2>Puntos clave</h2>
    <ul><li>El stock de la bodega 2 alcanza para dos semanas.</li><li>El proveedor necesita 10 días de anticipación.</li></ul>
    <h2>Inferido por la IA (no se dijo explícitamente)</h2>
    <p class="pdf-inferred">Por el plazo del proveedor, el pedido debe confirmarse esta semana.</p>
    <h2>Transcripción</h2>
    <div class="pdf-transcript"><p><b>09:30</b> Revisamos el stock de temporada; la bodega 2 alcanza para unas dos semanas.</p><p><b>09:34</b> El proveedor necesita diez días de anticipación para el pedido navideño.</p><p><b>09:41</b> Acordamos adelantar el pedido al 5 de diciembre.</p><p><b>09:44</b> Juan envía la cotización antes del miércoles.</p><p><b>09:52</b> Klever revisa hoy el inventario de la bodega 2.</p><p><b>10:05</b> Cierre de la reunión.</p></div>
    <footer class="pdf-foot"><span>Generado con Quedamos · resumen hecho con IA, revisado por Klever</span><span>Página 1 de 1</span></footer>
  </article>
</template>

<script>
const stage = document.getElementById('stage')
const MONTH = [
  [26,'out'],[27,'out'],[28,'out'],[29,'out'],[30,'out'],[31,'out'],[1],
  [2],[3],[4,'',[['task','Informe mensual']]],[5],[6],[7],[8],
  [9],[10,'',[['meet','Comité 10:00']]],[11],[12],[13],[14],[15],
  [16],[17],[18,'',[['meet','Proveedor 15:00']]],[19],[20],[21],[22],
  [23],[24],[25,'',[['meet','Equipo 09:00']]],[26],[27,'',[['due','Estados financieros']]],[28,'today sel',[['meet','Ventas 16:00'],['task','Inventario bodega 2']]],[29,'',[['meet','Equipo 09:00']]],
  [30],[1,'out'],[2,'out'],[3,'out',[['task','Cotización']]],[4,'out'],[5,'out'],[6,'out'],
]
function render(name) {
  const openSrc = name === 'fuente'
  const tpl = document.getElementById(`t-${openSrc ? 'inicio' : name}`) || document.getElementById('t-inicio')
  stage.replaceChildren(tpl.content.cloneNode(true))
  stage.querySelectorAll('[data-side]').forEach((slot) => {
    const side = document.getElementById('t-side').content.cloneNode(true)
    side.querySelector(`[data-k="${slot.dataset.side}"]`)?.classList.add('on')
    slot.replaceWith(side)
  })
  const m = stage.querySelector('.js-month')
  if (m) {
    m.innerHTML = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map((d) => `<div class="dow">${d}</div>`).join('') +
      MONTH.map(([n, cls = '', evs = []]) => `<div class="day ${cls}"><span class="n">${n}</span>${evs.map(([k, t]) => `<span class="ev ${k}">${t}</span>`).join('')}</div>`).join('')
  }
  stage.querySelectorAll('.js-wave').forEach((w) => {
    w.innerHTML = Array.from({ length: 22 }, (_, i) => `<i style="animation-delay:${(i * 0.07) % 1}s;animation-duration:${0.7 + (i % 5) * 0.12}s"></i>`).join('')
  })
  document.querySelectorAll('.review .tabs a').forEach((a) => a.classList.toggle('on', a.dataset.go === name))
  wire()
  if (openSrc) { stage.querySelector('.recbar')?.remove(); stage.querySelector('.note-tag').textContent = 'Selector de fuente abierto (clic en "Mixto ▾" junto a Grabar) · el medidor verde muestra que el micrófono le oye'; toggleSrc(true) }
  showSec(sessionStorage.getItem('profSec') || 'perfil')
}
function wire() {
  stage.querySelectorAll('[data-go]').forEach((a) => (a.onclick = () => (location.hash = a.dataset.go)))
  const demo = (btn) => {
    btn.onclick = () => {
      btn.classList.add('loading')
      btn.innerHTML = '<span class="spin"></span>Añadiendo…'
      setTimeout(() => {
        const ok = document.createElement('span')
        ok.className = 'cal-added'
        ok.innerHTML = '<svg class="ico" style="width:15px"><use href="#i-ok"/></svg>En su calendario'
        btn.replaceWith(ok)
      }, 900)
    }
  }
  stage.querySelectorAll('.js-demo-cal, .js-addcal').forEach(demo)
  const seg = stage.querySelector('.js-themeseg')
  if (seg) seg.querySelectorAll('span').forEach((s) => {
    s.classList.toggle('on', s.dataset.t === document.documentElement.dataset.theme)
    s.onclick = () => { if (s.dataset.t !== 'auto') setTheme(s.dataset.t); render('perfil') }
  })
  stage.querySelectorAll('.toggle').forEach((t) => (t.onclick = () => t.classList.toggle('on')))
  stage.querySelectorAll('.js-srcbtn').forEach((b) => (b.onclick = (e) => { e.stopPropagation(); toggleSrc() }))
  stage.querySelectorAll('.js-srcmenu > div').forEach((it) => (it.onclick = () => {
    if (it.classList.contains('mic-lvl')) return
    const name = it.querySelector('b').textContent
    stage.querySelectorAll('.js-srcmenu > div').forEach((o) => { o.classList.remove('on', 'hl'); o.querySelector('.chk')?.remove() })
    it.classList.add('on', 'hl'); it.insertAdjacentHTML('beforeend', '<svg class="ico chk"><use href="#i-ok"/></svg>')
    stage.querySelectorAll('.js-srcbtn').forEach((b) => (b.textContent = (name === 'Solo la computadora' ? 'PC' : name) + ' ▾'))
    setTimeout(() => toggleSrc(false), 250)
  }))
  stage.querySelectorAll('.js-profnav a').forEach((a) => (a.onclick = () => showSec(a.dataset.sec)))
  stage.querySelectorAll('.box').forEach((b) => (b.onclick = () => b.classList.toggle('done')))
}
// live animations: recording timer + processing progress
let secs = 767, pct = 48, wait = 42
setInterval(() => {
  secs++
  document.querySelectorAll('.js-rectime').forEach((t) => (t.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`))
  pct = pct >= 100 ? 12 : pct + 2
  const label = pct < 70 ? `Transcribiendo parte ${Math.min(4, 1 + Math.floor(pct / 18))} de 4` : pct < 100 ? 'Resumiendo y buscando pendientes' : 'Listo'
  document.querySelectorAll('.js-pct').forEach((e) => (e.textContent = `${pct}%`))
  document.querySelectorAll('.js-bar').forEach((e) => (e.style.width = `${pct}%`))
  document.querySelectorAll('.js-steplabel').forEach((e) => (e.textContent = label))
  wait = wait <= 0 ? 42 : wait - 1
  document.querySelectorAll('.js-wait').forEach((e) => (e.textContent = `Groq pide esperar 0:${String(wait).padStart(2, '0')} (límite por hora). Sigue solo.`))
}, 1000)

function toggleSrc(force) {
  const m = stage.querySelector('.js-srcmenu'); if (!m) return
  const open = force ?? m.hidden
  m.hidden = !open
  stage.querySelector('.js-srcbtn')?.classList.toggle('open', open)
}
document.addEventListener('click', (e) => { if (!e.target.closest('.js-srcmenu')) toggleSrc(false) })
function showSec(k) {
  const nav = stage.querySelector('.js-profnav'); if (!nav) return
  sessionStorage.setItem('profSec', k)
  nav.querySelectorAll('a').forEach((a) => a.classList.toggle('on', a.dataset.sec === k))
  stage.querySelectorAll('.sec').forEach((x) => (x.hidden = x.dataset.s !== k))
}
const setTheme = (t) => {
  document.documentElement.dataset.theme = t
  localStorage.setItem('mockTheme', t)
  document.querySelectorAll('[data-theme-set]').forEach((b) => b.classList.toggle('on', b.dataset.themeSet === t))
}
document.querySelectorAll('[data-theme-set]').forEach((b) => (b.onclick = () => setTheme(b.dataset.themeSet)))
document.querySelectorAll('.review [data-go]').forEach((a) => (a.onclick = (e) => { e.preventDefault(); location.hash = a.dataset.go }))
const params = new URLSearchParams(location.search)
setTheme(params.get('theme') || localStorage.getItem('mockTheme') || 'light')
const route = () => render(location.hash.slice(1) || 'inicio')
addEventListener('hashchange', route)
route()
</script>
</body>
</html>
